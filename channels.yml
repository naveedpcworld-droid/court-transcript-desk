# Channel registry. Add or remove channels here.
#
# source_tier:
#   official_court   = court-owned channel
#   official_judge   = judge-owned docket channel
#   licensed_media   = Court TV / Law & Crime / CVN style; needs a licence
#   commentary       = competitor/commentary channel; internal watchlist only
#
# rights_status:
#   public_court_feed | licensed | live_only | no_recording_order | commentary_internal_only | unknown
#
# public: true means it can appear on the student site.
# publish_transcript: true means the transcript can be stored and shown.
# Monitor-only channels still record metadata in the private repo, but are not published.

settings:
  timezone: UTC
  max_new_per_channel: 5
  max_total_new: 40
  backfill_new_channels: 3
  transcript_languages: ["en"]
  # Public site is only for cleared sources. Do not set this to true casually.
  public_site: true

channels:
